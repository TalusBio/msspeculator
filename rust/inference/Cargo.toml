[package]
name = "msspeculator-inference"
version = "0.1.0"
edition = "2021"
description = "High-throughput Rust inference and spectral-library writers for msspeculator."
license.workspace = true

[lib]
name = "msspeculator_inference"
path = "src/lib.rs"

[dependencies]
msspeculator-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
blake2 = "0.10"
