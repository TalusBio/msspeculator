[package]
name = "msspeculator-core"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust msspeculator inference: artifact loading, chem m/z, student forward."
license.workspace = true

[dependencies]
ndarray = "0.16"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = "0.2"
anyhow = "1"
pest = "2.8"
pest_derive = "2.8"
blake2 = "0.10"
