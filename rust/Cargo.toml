[package]
name = "pepdistill_rs"
version = "0.1.0"
edition = "2021"
description = "Rust tokenizer/batcher for pepdistill: packs precursors into numpy arrays."

[lib]
name = "pepdistill_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
ndarray = "0.16"
