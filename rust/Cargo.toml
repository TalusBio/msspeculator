[workspace]
members = ["core", "cli"]
resolver = "2"

[package]
name = "pepdistill_rs"
version = "0.1.0"
edition = "2021"
description = "Rust chemistry + tokenizer/batcher binding over pepdistill-core, exposed to Python as pepdistill_rs."

[lib]
name = "pepdistill_rs"
crate-type = ["cdylib"]

[dependencies]
pepdistill-core = { path = "core" }
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
ndarray = "0.16"
anyhow = "1"
