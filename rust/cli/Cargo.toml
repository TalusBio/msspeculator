[package]
name = "pepdistill-cli"
version = "0.1.0"
edition = "2021"
description = "pepdistill Rust inference: FASTA libraries and single-peptide prediction."

[[bin]]
name = "pepdistill-cli"
path = "src/main.rs"

[dependencies]
pepdistill-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
