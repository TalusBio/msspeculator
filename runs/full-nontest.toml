# Full non-holdout PROSPECT training run.
# Includes every shard from prospect, tmt, multi_ptm, and tmt_ptm.
# Deliberately excludes test_ptm (prospective holdout).
# Estimated extracted annotation size: ~242 GB, plus metadata.

out = "runs/full-nontest"
preset = "small"
activation = "gelu_tanh"
device = "auto"
seed = 0
# Optional shared cache:
# cache_s3_prefix = "s3://my-bucket/pepdistill-cache"

[pretrain]
enabled = true
teacher = "alphapeptdeep"
passes = 2
chunk_size = 10000
patience = 5

[[pretrain.sources]]
fasta = "/path/to/pretrain.fasta"
enzyme = "trypsin"
missed = 2
min_len = 7
max_len = 30
min_charge = 2
max_charge = 4
max_var_mods = 1

[train]
enabled = true
epochs = 60
batch_size = 256
lr = 0.0003
early_stop_patience = 5
early_stop_min_delta = 0.001

[[train.sources]]
record = "prospect"
meta = "TUM_HLA_meta_data.parquet"
zip = "TUM_HLA.zip"
shards = "all"
dataset = "prospect_tum_hla"
instrument = "Lumos"

