# Scaled run targeting DIA-useful accuracy. The 0.626 run was preset=small, 1 shard, 60 epochs.
# Two levers move here, deliberately:
#
#   1. Pretrain peptide diversity. Pretrain losses fell 35-45% (MS2 0.227->0.147, CCS
#      0.022->0.012) purely from exhaustive charge coverage, so the distillation signal is not
#      saturated. `passes` is the wrong knob for that now -- with all_charge_states the charges
#      are already exhaustive, so another pass only re-rolls a 2-state variable-mod form. The
#      lever is MORE PEPTIDES, hence a second proteome. Pretrain streams, so this costs time,
#      not memory.
#
#   2. Real data + capacity, the recorded "real-data + longer" lever: preset small -> base
#      (132K -> 899K params, d_model 64->128, 2->4 layers; width first per the arch sweep) and
#      1 -> 6 third-pool shards (60,628 -> ~364,000 examples).
#
# epochs 60 -> 80 rather than 200: with 6x the data per epoch, 80 epochs is already ~8x the
# example-views of the 0.626 run. 200 would be ~20x and mostly wall-clock.
#
# Caveats that bound what this can show:
#   - Two variables move at once, so a disappointing result will not say which mattered.
#   - More shards buys peptides, NOT modifications: third pool carries only UNIMOD 4 and 35.
#     Terminal mods, mass-only, and the 18 newly-resolvable types stay unexercised.
#   - All 6 shards are one pool -> one ChromRunbook dataset row, so the per-dataset RT affine
#     still only ever fits a single row.
#   - _load_real materializes every shard and merge_real_labels makes a second copy, so peak
#     memory is ~2x the final size. The teacher is now released before this stage (a6f070a),
#     which is what previously OOM-killed even a single-shard run.

out = "runs/modrep-v2-dia"
preset = "base"
device = "auto"
seed = 0

[pretrain]
enabled = true
teacher = "alphapeptdeep"
nce_min = 20.0
nce_max = 40.0
passes = 1
chunk_size = 10000

[[pretrain.sources]]
# E. coli K-12 (UP000000625), 4,403 proteins -> 211,347 tryptic peptides. Kept so the corpus
# from the 0.626 baseline is still represented.
fasta = "/Users/sebastianpaez/Downloads/ecoli_UP000000625.fasta"
enzyme = "trypsin"
missed = 2
min_len = 7
max_len = 30
min_charge = 2
max_charge = 4
max_var_mods = 1

[[pretrain.sources]]
# Human (UP000005640), 20,586 proteins -> ~1M tryptic peptides. Also the organism third pool's
# peptides actually come from, so the added diversity is on-target rather than incidental.
fasta = "/Users/sebastianpaez/Downloads/UP000005640_9606.fasta"
enzyme = "trypsin"
missed = 2
min_len = 7
max_len = 30
min_charge = 2
max_charge = 4
max_var_mods = 1

[train]
enabled = true
record = "prospect"
meta = "TUM_third_pool_meta_data.parquet"
zip = "TUM_third_pool.zip"
shards = [0, 1, 2, 3, 4, 5]
epochs = 80
loss_weights = [1.0, 1.0, 1.0]
